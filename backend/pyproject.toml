[project]
name = "fmip-backend"
version = "1.0.0"
description = "AI-Powered Institutional Financial Markets Intelligence Platform"
readme = "../README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
