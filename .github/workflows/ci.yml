name: FMIP Institutional CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-verification-and-security-audit:
    name: Backend, Quant Engine, 8-Agent & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute All 20 Verification & Security Suites (Phases 2-6)
        env:
          PYTHONPATH: backend
        run: |
          python scripts/run_all_tests.py

  docker-compose-validation:
    name: Docker Compose & Container Architecture Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Full Profile
        run: |
          cp .env.example .env
          docker compose --profile full config --services
